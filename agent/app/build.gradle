apply plugin: 'com.android.application'

android {
    namespace 'com.htit.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.htit.remote"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.2.2"
    }

    signingConfigs {
        debug {
            // reuse the auto-generated debug keystore so release APKs install on internal devices
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
