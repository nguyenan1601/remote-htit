apply plugin: 'com.android.application'

android {
    namespace 'com.htit.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.htit.remote"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            // reuse the auto-generated debug keystore so release APKs install on internal devices
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // no external dependencies on purpose (framework APIs only)
}
